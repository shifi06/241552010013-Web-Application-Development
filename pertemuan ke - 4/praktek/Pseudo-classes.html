<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-classes</title>
    <style>
        a:hover { color: red; }
        button:active { background-color: orange; }
        input:focus { border: 2px solid blue; background-color: #f0f8ff; }
        li:first-child { font-weight: bold; }
        li:nth-child(2) { color: red; }
    </style>
</head>
<body>
    <a href="#">Hover saya</a>
    <button>Klik saya</button>
    <input type="text" placeholder="Focus di sini">
    <ul>
        <li>Pertama</li>
        <li>Kedua</li>
        <li>Ketiga</li>
    </ul>
</body>
</html>
