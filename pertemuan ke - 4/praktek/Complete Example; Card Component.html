<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Card Component</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }
        .card-container {
            display: flex;
            gap: 20px;
        }
        .card {
            width: 300px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-image {
            width: 100%;
            height: 180px;
            background: #ccc;
        }
        .card-body {
            padding: 20px;
        }
        .card-title {
            margin-bottom: 10px;
        }
        .card-text {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .card-btn {
            background: #4CAF50;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .card-btn:hover {
            background: #388E3C;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-image"></div>
            <div class="card-body">
                <h2 class="card-title">Card Title</h2>
                <p class="card-text">Ini contoh card dengan box model lengkap.</p>
                <button class="card-btn">Learn More</button>
            </div>
        </div>
        <div class="card">
            <div class="card-image"></div>
            <div class="card-body">
                <h2 class="card-title">Another Card</h2>
                <p class="card-text">Kelas yang sama, tampilan tetap konsisten.</p>
                <button class="card-btn">Read More</button>
            </div>
        </div>
    </div>
</body>
</html>
