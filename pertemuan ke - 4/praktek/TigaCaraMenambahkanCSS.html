<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tiga Cara Menambahkan CSS</title>
    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
        }
        p {
            color: gray;
            font-size: 18px;
        }
    </style>
    <!-- External CSS (commented) -->
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="color: blue;">Blue heading</h1>
    <p style="color: red; font-size: 20px;">This text is red.</p>
</body>
</html>
