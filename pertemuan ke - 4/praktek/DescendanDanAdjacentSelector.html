<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Descendant & Adjacent</title>
    <style>
        div p { color: blue; }
        h2 + p { font-size: 18px; font-weight: bold; color: blue; }
    </style>
</head>
<body>
    <div>
        <p>Biru!</p>
        <section><p>Biru juga!</p></section>
    </div>
    <p>Tidak biru</p>

    <h2>Judul</h2>
    <p>Di-styling (tepat setelah h2)</p>
    <p>Tidak di-styling</p>
</body>
</html>
