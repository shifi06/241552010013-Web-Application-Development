<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Box-sizing</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid black;
            background: lightcoral;
        }
    </style>
</head>
<body>
    <div class="box">Lebar tetap 300px meski ada padding + border</div>
</body>
</html>
