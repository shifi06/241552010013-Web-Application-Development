<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pengantar CSS</title>
    <style>
        h1 {
            color: navy;
            font-size: 36px;
        }
        p {
            color: gray;
            line-height: 1.6;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Site</h1>
    <p>This is a paragraph.</p>
    <button>Click Me</button>
</body>
</html>
