<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Attribute Selectors</title>
    <style>
        input[type="text"] { border: 2px solid blue; }
        a[href*="google"] { color: orange; }
        a[href^="https"] { color: green; }
    </style>
</head>
<body>
    <input type="text" placeholder="Nama">
    <a href="https://google.com">Google</a>
</body>
</html>
