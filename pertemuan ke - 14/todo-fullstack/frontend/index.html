<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Todo App • Bengkel Grey 🔧</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #e8e8e8 0%, #d0d0d0 50%, #b8b8b8 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative tools */
        body::before {
            content: '🔧';
            position: absolute;
            font-size: 180px;
            bottom: -20px;
            left: -30px;
            opacity: 0.06;
            transform: rotate(-25deg);
        }

        body::after {
            content: '🔨';
            position: absolute;
            font-size: 140px;
            top: -10px;
            right: -20px;
            opacity: 0.05;
            transform: rotate(35deg);
        }

        /* Floating tools */
        .floating-tool {
            position: absolute;
            font-size: 28px;
            opacity: 0.08;
            animation: floatTool 12s ease-in-out infinite;
            pointer-events: none;
        }

        .floating-tool:nth-child(1) { top: 6%; left: 4%; animation-delay: 0s; font-size: 32px; }
        .floating-tool:nth-child(2) { top: 18%; right: 5%; animation-delay: 2.8s; font-size: 24px; }
        .floating-tool:nth-child(3) { bottom: 22%; left: 6%; animation-delay: 4.5s; font-size: 38px; }
        .floating-tool:nth-child(4) { bottom: 8%; right: 4%; animation-delay: 1.6s; font-size: 30px; }
        .floating-tool:nth-child(5) { top: 50%; left: 2%; animation-delay: 3.8s; font-size: 22px; }

        @keyframes floatTool {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 0.06;
            }
            30% {
                transform: translate(20px, -35px) rotate(18deg) scale(1.1);
                opacity: 0.12;
            }
            60% {
                transform: translate(-15px, -65px) rotate(-12deg) scale(0.9);
                opacity: 0.08;
            }
            85% {
                transform: translate(18px, -25px) rotate(10deg) scale(1.05);
                opacity: 0.12;
            }
        }

        .app {
            background: rgba(245, 245, 245, 0.92);
            backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10),
                        0 0 0 1px rgba(100, 100, 100, 0.08);
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(200, 200, 200, 0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .app:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.12);
        }

        /* --- Header --- */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }

        .header-icon {
            font-size: 36px;
            animation: wrenchTurn 3s ease-in-out infinite;
        }

        @keyframes wrenchTurn {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #2a2a2a;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.02);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            color: #888888;
            font-weight: 600;
            margin-top: -2px;
            margin-bottom: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .count-badge {
            display: inline-block;
            background: rgba(100, 100, 100, 0.10);
            color: #555555;
            padding: 2px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            margin-left: 10px;
            border: 1px solid rgba(100, 100, 100, 0.10);
            font-family: 'Inter', sans-serif;
        }

        /* --- Form --- */
        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 26px;
        }

        .add-form input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #d0d0d0;
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.4s ease;
            background: rgba(255, 255, 255, 0.7);
            color: #2a2a2a;
            font-weight: 400;
        }

        .add-form input:focus {
            border-color: #888888;
            box-shadow: 0 0 0 4px rgba(100, 100, 100, 0.08);
            background: white;
        }

        .add-form input::placeholder {
            color: #aaaaaa;
            font-weight: 400;
        }

        .add-form button {
            padding: 16px 32px;
            background: linear-gradient(135deg, #6a6a6a, #4a4a4a);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .add-form button:hover {
            background: linear-gradient(135deg, #7a7a7a, #5a5a5a);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .add-form button:active {
            transform: translateY(0);
        }

        /* --- Todo List --- */
        #list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        #list::-webkit-scrollbar {
            width: 4px;
        }

        #list::-webkit-scrollbar-track {
            background: #e8e8e8;
            border-radius: 10px;
        }

        #list::-webkit-scrollbar-thumb {
            background: #b0b0b0;
            border-radius: 10px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            margin-bottom: 10px;
            transition: all 0.4s ease;
            border: 1px solid rgba(200, 200, 200, 0.2);
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: white;
            border-color: #b0b0b0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .todo-item .text {
            flex: 1;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #2a2a2a;
            transition: all 0.4s ease;
            padding: 4px 0;
            letter-spacing: 0.2px;
        }

        .todo-item .text.done {
            text-decoration: line-through;
            color: #aaaaaa;
            font-weight: 400;
        }

        .todo-item .text::before {
            content: '⚡ ';
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .todo-item .text.done::before {
            content: '✅ ';
            opacity: 1;
        }

        .todo-item .delete-btn {
            background: none;
            border: none;
            color: #b0b0b0;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: all 0.3s ease;
            opacity: 0.4;
            line-height: 1;
        }

        .todo-item .delete-btn:hover {
            opacity: 1;
            color: #cc4444;
            background: rgba(200, 60, 60, 0.06);
            transform: scale(1.1);
        }

        /* --- Empty State --- */
        .empty-state {
            text-align: center;
            color: #888888;
            padding: 50px 20px 40px;
            font-weight: 600;
            font-size: 16px;
            opacity: 0.7;
            line-height: 2.2;
        }

        .empty-state .tool {
            font-size: 56px;
            display: block;
            margin-bottom: 14px;
            animation: wrenchTurn 4s ease-in-out infinite;
        }

        .empty-state .sub {
            font-size: 13px;
            opacity: 0.5;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            .app {
                padding: 28px 20px;
                border-radius: 24px;
            }
            h1 {
                font-size: 22px;
            }
            .add-form {
                flex-direction: column;
            }
            .add-form button {
                padding: 14px;
            }
            body::before {
                font-size: 120px;
                bottom: -20px;
                left: -30px;
            }
            body::after {
                font-size: 80px;
                top: -10px;
                right: -20px;
            }
            .floating-tool {
                display: none;
            }
            .header-icon {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating tools -->
    <div class="floating-tool">🔧</div>
    <div class="floating-tool">🔨</div>
    <div class="floating-tool">🛠️</div>
    <div class="floating-tool">⚙️</div>
    <div class="floating-tool">🔩</div>

    <div class="app">
        <div class="header">
            <span class="header-icon">🔧</span>
            <h1>Bengkel</h1>
            <span class="count-badge" id="countBadge">0</span>
        </div>
        <p class="subtitle">⚡ fix your tasks ⚡</p>

        <div class="add-form">
            <input type="text" id="inp" placeholder="tulis pekerjaanmu..." onkeydown="if(event.key=='Enter') addTodo()">
            <button onclick="addTodo()">Perbaiki</button>
        </div>

        <ul id="list"></ul>
    </div>

    <script>
        const API = 'http://localhost:3001/api/todos';

        async function loadTodos() {
            const list = document.getElementById('list');
            const badge = document.getElementById('countBadge');

            list.innerHTML = `
                <p class="empty-state">
                    <span class="tool">🔧</span>
                    menyiapkan peralatan...
                    <span class="sub"><br>sebentar ya</span>
                </p>
            `;

            try {
                const res = await fetch(API);
                const todos = await res.json();

                badge.textContent = todos.length;

                if (todos.length === 0) {
                    list.innerHTML = `
                        <p class="empty-state">
                            <span class="tool">🛠️</span>
                            bengkelmu masih kosong<br>
                            <span class="sub">mulai perbaikan pertamamu!</span>
                        </p>
                    `;
                    return;
                }

                list.innerHTML = todos.map(todo => `
                    <li class="todo-item">
                        <span class="text ${todo.done ? 'done' : ''}" onclick="toggleTodo(${todo.id}, ${!todo.done})">
                            ${todo.text}
                        </span>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})" title="Hapus">✕</button>
                    </li>
                `).join('');

            } catch (e) {
                list.innerHTML = `
                    <p class="empty-state">
                        <span class="tool">😢</span>
                        gagal memuat bengkel<br>
                        <span class="sub">pastikan backend berjalan di port 3001</span>
                    </p>
                `;
                console.error(e);
            }
        }

        async function addTodo() {
            const input = document.getElementById('inp');
            const text = input.value.trim();

            if (!text) {
                input.style.borderColor = '#888888';
                input.style.boxShadow = '0 0 0 4px rgba(100,100,100,0.08)';
                setTimeout(() => {
                    input.style.borderColor = '#d0d0d0';
                    input.style.boxShadow = 'none';
                }, 800);
                return;
            }

            try {
                await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                input.value = '';
                loadTodos();
            } catch (e) {
                alert('Gagal menambahkan pekerjaan 😢');
            }
        }

        async function toggleTodo(id, newDone) {
            try {
                await fetch(`${API}/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ done: newDone })
                });
                loadTodos();
            } catch (e) {
                alert('Gagal update pekerjaan');
            }
        }

        async function deleteTodo(id) {
            if (!confirm('Yakin mau selesaikan pekerjaan ini? 🔧')) return;
            try {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                loadTodos();
            } catch (e) {
                alert('Gagal menghapus pekerjaan');
            }
        }

        document.addEventListener('DOMContentLoaded', loadTodos);
    </script>

</body>
</html>
